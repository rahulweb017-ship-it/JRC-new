<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Denver home remodelers. Get a free estimate!" />
    <title>JRC Home Remodeling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; text shows in the fallback font until they arrive -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Work+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Work+Sans:wght@400;500;600;700&display=swap" />
    </noscript>
    <script>
      // The home hero images are only referenced from JS/CSS, so the browser
      // would discover them late. Start fetching them with the HTML instead.
      if (location.pathname === '/') {
        var addLink = function (attrs) {
          var link = document.createElement('link');
          for (var key in attrs) link.setAttribute(key, attrs[key]);
          document.head.appendChild(link);
        };
        var heroSizes = '(max-width: 991px) calc(100vw - 40px), 50vw';
        addLink({ rel: 'preload', as: 'image', href: '/assets/images/hero-cream-pattern.jpg', fetchpriority: 'high' });
        ['after', 'before'].forEach(function (side) {
          var base = '/assets/images/hero-bathroom-' + side;
          addLink({
            rel: 'preload',
            as: 'image',
            href: base + '.webp',
            imagesrcset: base + '-700.webp 700w, ' + base + '.webp 1000w',
            imagesizes: heroSizes,
            fetchpriority: 'high'
          });
        });
        // Filled in at build time by the home-chunk-preload Vite plugin.
        var home = __HOME_PRELOAD__;
        home.js.forEach(function (href) { addLink({ rel: 'modulepreload', href: href }); });
        home.css.forEach(function (href) { addLink({ rel: 'preload', as: 'style', href: href }); });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
